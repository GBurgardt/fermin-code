name: Proponer una función
description: Proponé una mejora concreta de producto o protocolo
title: "[Propuesta]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Describí el problema del usuario antes de sugerir la implementación.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Frontera del producto
      description: ¿Por qué corresponde al relay, engine, Desktop o Mobile y no a Codex?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Resultado propuesto
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Impacto en seguridad y compatibilidad
