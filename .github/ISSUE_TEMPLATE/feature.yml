name: Feature proposal
description: Propose a focused product or protocol improvement
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before suggesting implementation.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Product boundary
      description: Why should this belong to the relay, engine, Desktop, or Mobile rather than Codex itself?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
