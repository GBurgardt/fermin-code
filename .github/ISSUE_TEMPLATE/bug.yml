name: Reportar un bug
description: Informá un defecto reproducible de Fermín
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Componente
      options: [Service, Desktop, Mobile, Documentación]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Comportamiento observado
      description: ¿Qué ocurrió y qué esperabas?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproducción
      description: Pasos mínimos, datos ocultos y versiones relevantes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Diagnósticos sin datos privados
      description: Nunca incluyas tokens, prompts privados, URLs de producción ni archivos personales.
