name: Bug report
description: Report a reproducible Fermín Code defect
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Service, Desktop, Mobile, Documentation]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal, redacted steps and relevant versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted diagnostics
      description: Never include tokens, private prompts, production URLs, or personal files.
