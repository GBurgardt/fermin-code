<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1240" viewBox="0 0 360 620" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura de estrella de Fermín</title>
  <desc id="description">Tres clientes se conectan con un relay durable central. El relay deriva las órdenes hacia tres hosts, cada uno con un engine y Codex. No hay conexiones directas entre clientes y engines.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="relay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect width="360" height="620" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="358" height="618" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="180" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Todo pasa por el relay</text>
  <text x="180" y="61" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" text-anchor="middle">N clientes · una central · M hosts</text>

  <text x="18" y="94" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">CLIENTES</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="18" y="108" width="98" height="54" rx="12" fill="#161b22" stroke="#3b4552"/>
    <circle cx="42" cy="135" r="7" fill="#58a6ff"/>
    <text x="76" y="140" fill="#f0f6fc" font-size="12.5" font-weight="650">iPhone</text>

    <rect x="131" y="108" width="98" height="54" rx="12" fill="#161b22" stroke="#3b4552"/>
    <rect x="151" y="128" width="15" height="11" rx="2" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <path d="M148 143h21" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    <text x="195" y="140" fill="#f0f6fc" font-size="12.5" font-weight="650">Desktop</text>

    <rect x="244" y="108" width="98" height="54" rx="12" fill="#161b22" stroke="#3b4552"/>
    <path d="M264 128h13v13h-13z M269 123h13v13" fill="none" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="309" y="140" fill="#f0f6fc" font-size="12.5" font-weight="650">Otra app</text>
  </g>

  <g fill="none" stroke="#7d8590" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M67 162v25c0 11 9 20 20 20h53"/>
    <path d="M180 162v35"/>
    <path d="M293 162v25c0 11-9 20-20 20h-53"/>
  </g>

  <rect x="43" y="207" width="274" height="126" rx="20" fill="url(#relay)"/>
  <rect x="45" y="209" width="270" height="122" rx="18" fill="none" stroke="#c4b5fd" stroke-opacity="0.42"/>
  <text x="180" y="246" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="750" text-anchor="middle">Relay durable</text>
  <text x="180" y="273" fill="#f5f3ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">recibe · guarda · deriva</text>
  <text x="180" y="299" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" text-anchor="middle">toma custodia y conserva la historia</text>

  <g fill="none" stroke="#7d8590" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M140 333v28c0 11-9 20-20 20H67v25"/>
    <path d="M180 333v73"/>
    <path d="M220 333v28c0 11 9 20 20 20h53v25"/>
  </g>

  <text x="18" y="386" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">HOSTS</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="18" y="414" width="98" height="108" rx="14" fill="#161b22" stroke="#2ea043" stroke-width="1.3"/>
    <circle cx="67" cy="438" r="6" fill="#3fb950"/>
    <text x="67" y="463" fill="#f0f6fc" font-size="13" font-weight="700">Puky</text>
    <text x="67" y="486" fill="#8b949e" font-size="11">Engine</text>
    <text x="67" y="503" fill="#8b949e" font-size="11">+ Codex</text>

    <rect x="131" y="414" width="98" height="108" rx="14" fill="#161b22" stroke="#2ea043" stroke-width="1.3"/>
    <circle cx="180" cy="438" r="6" fill="#3fb950"/>
    <text x="180" y="459" fill="#f0f6fc" font-size="11.5" font-weight="700">Mac</text>
    <text x="180" y="474" fill="#f0f6fc" font-size="11.5" font-weight="700">personal</text>
    <text x="180" y="495" fill="#8b949e" font-size="11">Engine</text>
    <text x="180" y="512" fill="#8b949e" font-size="11">+ Codex</text>

    <rect x="244" y="414" width="98" height="108" rx="14" fill="#161b22" stroke="#2ea043" stroke-width="1.3"/>
    <circle cx="293" cy="438" r="6" fill="#3fb950"/>
    <text x="293" y="459" fill="#f0f6fc" font-size="11.5" font-weight="700">Otro</text>
    <text x="293" y="474" fill="#f0f6fc" font-size="11.5" font-weight="700">host</text>
    <text x="293" y="495" fill="#8b949e" font-size="11">Engine</text>
    <text x="293" y="512" fill="#8b949e" font-size="11">+ Codex</text>
  </g>

  <rect x="18" y="546" width="324" height="52" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="180" y="567" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="650" text-anchor="middle">No hay conexión directa cliente → engine</text>
  <text x="180" y="585" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Forma objetivo · v0.1 usa un relay por host</text>
</svg>
