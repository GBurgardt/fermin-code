<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura objetivo de Fermín</title>
  <desc id="description">Varios clientes se conectan con un relay durable. El relay entrega las órdenes a varios hosts con engine y Codex. No existen conexiones directas entre clientes y engines.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="24" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="673" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="58" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="650" text-anchor="middle">Arquitectura objetivo</text>
  <text x="600" y="88" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" text-anchor="middle">N clientes · 1 relay · M hosts</text>

  <text x="70" y="135" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650" letter-spacing="1.4">CLIENTES</text>
  <text x="935" y="135" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650" letter-spacing="1.4">HOSTS</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="70" y="165" width="220" height="92" rx="14" fill="#161b22" stroke="#3b4552" stroke-width="1.5"/>
    <text x="95" y="203" fill="#f0f6fc" font-size="19" font-weight="650">iPhone</text>
    <text x="95" y="229" fill="#8b949e" font-size="14">Cliente Mobile</text>

    <rect x="70" y="281" width="220" height="92" rx="14" fill="#161b22" stroke="#3b4552" stroke-width="1.5"/>
    <text x="95" y="319" fill="#f0f6fc" font-size="19" font-weight="650">Mac</text>
    <text x="95" y="345" fill="#8b949e" font-size="14">Cliente Desktop</text>

    <rect x="70" y="397" width="220" height="92" rx="14" fill="#161b22" stroke="#3b4552" stroke-width="1.5"/>
    <text x="95" y="435" fill="#f0f6fc" font-size="19" font-weight="650">Otra aplicación</text>
    <text x="95" y="461" fill="#8b949e" font-size="14">Cliente del relay</text>

    <rect x="910" y="165" width="220" height="92" rx="14" fill="#161b22" stroke="#3b4552" stroke-width="1.5"/>
    <text x="935" y="203" fill="#f0f6fc" font-size="19" font-weight="650">Host 1</text>
    <text x="935" y="229" fill="#8b949e" font-size="14">Engine + Codex</text>

    <rect x="910" y="281" width="220" height="92" rx="14" fill="#161b22" stroke="#3b4552" stroke-width="1.5"/>
    <text x="935" y="319" fill="#f0f6fc" font-size="19" font-weight="650">Host 2</text>
    <text x="935" y="345" fill="#8b949e" font-size="14">Engine + Codex</text>

    <rect x="910" y="397" width="220" height="92" rx="14" fill="#161b22" stroke="#3b4552" stroke-width="1.5"/>
    <text x="935" y="435" fill="#f0f6fc" font-size="19" font-weight="650">Host M</text>
    <text x="935" y="461" fill="#8b949e" font-size="14">Engine + Codex</text>
  </g>

  <g fill="none" stroke="#7d8590" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M290 211H430"/>
    <path d="M290 327H430"/>
    <path d="M290 443H430"/>
    <path d="M770 211H910"/>
    <path d="M770 327H910"/>
    <path d="M770 443H910"/>
  </g>

  <text x="360" y="195" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">HTTPS + SSE</text>
  <text x="840" y="195" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">WebSocket</text>

  <rect x="430" y="165" width="340" height="324" rx="20" fill="#161b22" stroke="#8b5cf6" stroke-width="2"/>
  <text x="600" y="232" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="650" text-anchor="middle">Relay durable</text>
  <line x1="485" y1="260" x2="715" y2="260" stroke="#30363d" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="485" y="306" fill="#f0f6fc" font-size="17" font-weight="600">Persistencia</text>
    <text x="485" y="332" fill="#8b949e" font-size="14">Guarda antes de aceptar</text>

    <text x="485" y="376" fill="#f0f6fc" font-size="17" font-weight="600">Routing</text>
    <text x="485" y="402" fill="#8b949e" font-size="14">Selecciona el host autorizado</text>

    <text x="485" y="446" fill="#f0f6fc" font-size="17" font-weight="600">Recuperación</text>
    <text x="485" y="472" fill="#8b949e" font-size="14">Mantiene eventos y cursores</text>
  </g>

  <rect x="70" y="545" width="1060" height="74" rx="12" fill="#11161d" stroke="#30363d"/>
  <text x="600" y="576" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" text-anchor="middle">Los clientes y engines se conectan al relay. No existe una conexión directa cliente → engine.</text>
  <text x="600" y="600" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">Arquitectura objetivo · v0.1 usa una instancia de relay por host</text>
</svg>
